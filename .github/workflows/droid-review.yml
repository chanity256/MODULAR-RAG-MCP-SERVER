# AI_NATIVE_SDLC_SPEC SD2.3：Factory Droid 自动 PR review（shallow，含自动 security review）。
# 仅作参考意见，不是分支保护的必需 check；review 指令由 droid-action 注入 .factory/skills/review-guidelines/SKILL.md。
# 需要 Actions secret FACTORY_API_KEY，且仓库已安装 Factory Droid GitHub App。
# 审查模型（2026-11-23 成本决策走 BYOK；2026-11-24 复裁换端点）：固定走使用者的 BYOK
# OpenCode（OPENCODE_API_KEY + evals/ci/factory-settings.json，model deepseek-v4.1-flash，
# OpenAI 兼容端点 https://opencode.ai/inference/openai/v1，经 apiKeyHelper 读文件、
# key 不进 agent 会话环境），花费计入使用者 OpenCode 额度而非 Factory credits；
# 接线方式与 agent-evals.yml 的「Configure BYOK model (D5)」一致，锁定见 test_review_guidelines.py。
name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # OpenCode key 不进 agent 会话的环境变量（SD3.6 基线教训）：写到文件，由 droid 的 apiKeyHelper 读取。
      # droid exec 读 ~/.factory/settings.json；droid-action 的 settings 输入只写 ~/.factory/droid/settings.json
      # （MCP 注册），所以这里在该步骤直接预写 droid 真正读取的路径。
      - name: Configure BYOK review model (D5, OpenCode DeepSeek)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          test -n "$OPENCODE_API_KEY" || { echo "::error::OPENCODE_API_KEY secret is empty"; exit 1; }
          umask 077
          keys="$HOME/.factory/review-keys"
          mkdir -p "$keys"
          printf '%s' "$OPENCODE_API_KEY" > "$keys/opencode.key"
          printf '#!/bin/sh\nexec cat %s\n' "$keys/opencode.key" > "$keys/opencode-key.sh"
          chmod 700 "$keys/opencode-key.sh"
          # OpenCode Go 强制 x-opencode-session 头：每次 review run 注入唯一会话 ID。
          sid="ses_review_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          jq --arg helper "$keys/opencode-key.sh" --arg sid "$sid" \
            '.customModels[0].apiKeyHelper = $helper | .customModels[0].extraHeaders["x-opencode-session"] = $sid' \
            evals/ci/factory-settings.json > "$HOME/.factory/settings.json"
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: shallow
          review_model: custom:deepseek-v4.1-flash-0
          security_model: custom:deepseek-v4.1-flash-0
          allowed_bots: factory-droid
