# AI_NATIVE_SDLC_SPEC SD2.3：Factory Droid 自动 PR review（shallow，含自动 security review）。
# 仅作参考意见，不是分支保护的必需 check；review 指令由 droid-action 注入 .factory/skills/review-guidelines/SKILL.md。
# 需要 Actions secret FACTORY_API_KEY，且仓库已安装 Factory Droid GitHub App。
name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          review_depth: shallow
          allowed_bots: factory-droid
