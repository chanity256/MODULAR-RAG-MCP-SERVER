# AI_NATIVE_SDLC_SPEC SD1：CI 确定性门。命令与 AGENTS.md「常用命令」逐字同源；不做 CD、不开门控真实集成测试。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ingest-formats]"
      # SD1.5：pytest-socket 只放行 loopback（e2e_web 假后端在本机起服务）；
      # NO_PROXY 防止经系统级本地代理（127.0.0.1）绕出外网。
      - name: Offline tests (network disabled)
        run: NO_PROXY='*' pytest tests -q --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1
      - name: Red-line checks
        run: python scripts/check_redlines.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
