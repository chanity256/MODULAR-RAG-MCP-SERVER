[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "Modular RAG MCP Server — pluggable, observable, local-first knowledge retrieval over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Modular RAG MCP Server" }]
keywords = ["rag", "mcp", "retrieval-augmented-generation", "model-context-protocol"]
# Runtime dependencies are intentionally minimal in the skeleton (阶段 A).
# Heavy deps (chromadb, openai, streamlit, mcp) are added in later phases.
dependencies = [
    "pyyaml>=6.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-check>=2.0",
    # agentic_search sidecar 客户端（运行时经 chromadb 间接安装；此处显式登记以防上游移除）
    "httpx>=0.27",
]

[project.scripts]
modular-rag-mcp-server = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "unit: unit tests (fast, isolated)",
    "integration: integration tests (component collaboration)",
    "e2e: end-to-end tests (full business flow)",
]
